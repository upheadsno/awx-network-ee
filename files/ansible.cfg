[defaults]
force_valid_group_names = always
gathering = explicit
# python3.12 is the interpreter the EE installs all collection deps into
# (infisicalsdk, pynetbox, …); /usr/bin/python3 is 3.9 and lacks them.
interpreter_python = /usr/bin/python3.12
jinja2_extenstions = jinja2.ext.loopcontrols,jinja2.ext.do,jinja2.ext.i18n
jinja2_native = true
stdout_callback = yaml
